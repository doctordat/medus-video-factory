name: Whiteboard Smoke Test

on:
  push:
    branches:
      - main
    paths:
      - 'skills/srt-whiteboard-animation/**'
      - '.github/workflows/whiteboard-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Render bundled whiteboard demo
        run: bash skills/srt-whiteboard-animation/run_demo.sh

      - name: Upload demo MP4
        uses: actions/upload-artifact@v4
        with:
          name: medus-whiteboard-demo
          path: skills/srt-whiteboard-animation/outputs/medus-whiteboard-demo.mp4
          if-no-files-found: error
          retention-days: 7
